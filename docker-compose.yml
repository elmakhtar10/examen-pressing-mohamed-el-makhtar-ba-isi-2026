version: '3.8'

services:
  # Service Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: pressing_postgres
    restart: always
    environment:
      POSTGRES_DB: pressing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Service Backend Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pressing_backend
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pressing_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
    depends_on:
      - postgres

volumes:
  postgres_data: