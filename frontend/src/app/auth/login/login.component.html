<div class="min-h-screen bg-slate-100 flex flex-col justify-center items-center p-4 font-sans">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xs border border-slate-200 p-8">

    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img src="assets/logo.png" alt="Pressing LIC" class="h-20 w-auto object-contain" height="1024" width="1024"/>
    </div>

    <!-- Titres -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Bienvenue</h1>
      <p class="text-xs text-slate-500">Connectez-vous pour accéder à votre espace Pressing LIC.</p>
    </div>

    <!-- Alert Erreur  -->
    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl font-medium">
        {{ errorMessage }}
      </div>
    }

    <!-- Formulaire -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-2">ADRESSE EMAIL</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/></svg>
          </span>
          <input
            type="email"
            [(ngModel)]="credentials.email"
            name="email"
            required
            placeholder="vous@exemple.com"
            class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
          />
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-bold text-slate-600 uppercase">MOT DE PASSE</label>
          <a href="#" class="text-xs font-semibold text-blue-600 hover:underline">Mot de passe oublié ?</a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0V10.5m-1.5 0h12A1.5 1.5 0 0 1 19.5 12v6.75a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5V12a1.5 1.5 0 0 1 1.5-1.5Z"/></svg>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="credentials.password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full pl-10 pr-10 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
          />
          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
          </button>
        </div>
      </div>

      <div class="flex items-center">
        <input
          type="checkbox"
          id="remember"
          [(ngModel)]="rememberMe"
          name="remember"
          class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500"
        />
        <label for="remember" class="ml-2 text-xs text-slate-600 font-medium">Se souvenir de moi</label>
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition duration-200 shadow-xs disabled:opacity-50 flex items-center justify-center space-x-2">
        @if (loading) {
          <span>Connexion en cours...</span>
        } @else {
          <span>Se connecter</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
        }
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-600">
        Nouveau sur Pressing LIC ?
        <a routerLink="/register" class="font-bold text-blue-600 hover:underline ml-1">Créer un compte</a>
      </p>
    </div>
  </div>

  <div class="mt-8 text-center text-xs text-slate-400">
    © 2026 Pressing LIC. Tous droits réservés.<br/>
    <span class="text-slate-500 hover:underline cursor-pointer">Support Technique</span>
  </div>
</div>
