<div class="min-h-screen bg-slate-100 flex flex-col justify-center items-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img ngSrc="../../../../public/assets/logo.png" alt="Pressing LIC" class="h-20 w-auto object-contain" height="1024" width="1024"/>
    </div>

    <!-- Titres -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-2">Bienvenue</h1>
      <p class="text-sm text-slate-500">Connectez-vous pour accéder à votre espace Pressing LIC.</p>
    </div>

    <!-- Alert Erreur  -->
    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl">
        {{ errorMessage }}
      </div>
    }

    <!-- Formulaire -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-2">ADRESSE EMAIL</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            ✉️
          </span>
          <input
            type="email"
            [(ngModel)]="credentials.email"
            name="email"
            required
            placeholder="vous@exemple.com"
            class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
          />
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-bold text-slate-600 uppercase">MOT DE PASSE</label>
          <a href="#" class="text-xs font-medium text-blue-600 hover:underline">Mot de passe oublié ?</a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            🔒
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="credentials.password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full pl-10 pr-10 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
          />
          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
            👁️
          </button>
        </div>
      </div>

      <div class="flex items-center">
        <input
          type="checkbox"
          id="remember"
          [(ngModel)]="rememberMe"
          name="remember"
          class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500"
        />
        <label for="remember" class="ml-2 text-xs text-slate-600">Se souvenir de moi</label>
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl transition duration-200 shadow-sm disabled:opacity-50">
        @if (loading) {
          <span>Connexion en cours...</span>
        } @else {
          <span>Se connecter</span>
        }
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-600">
        Nouveau sur Pressing LIC ?
        <a routerLink="/register" class="font-bold text-blue-600 hover:underline ml-1">Créer un compte</a>
      </p>
    </div>
  </div>

  <div class="mt-8 text-center text-xs text-slate-400">
    © 2026 Pressing LIC. Tous droits réservés.<br/>
    <span class="text-slate-500 hover:underline cursor-pointer">Support Technique</span>
  </div>
</div>
