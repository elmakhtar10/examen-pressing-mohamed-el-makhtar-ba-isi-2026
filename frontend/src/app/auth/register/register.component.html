<div class="min-h-screen bg-slate-100 flex flex-col justify-center items-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

    <!-- Logo -->
    <div class="flex justify-center mb-3">
      <img ngSrc="../../../../public/assets/logo.png" alt="Pressing LIC" class="h-16 w-auto object-contain" height="1024" width="1024"/>
    </div>

    <!-- Titres -->
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-slate-900 mb-1">Créer un compte</h1>
      <p class="text-xs text-slate-500">Rejoignez la plateforme Pressing LIC</p>
    </div>

    <!-- Alert Erreur -->
    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl">
        {{ errorMessage }}
      </div>
    }

    <!-- Formulaire -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nom complet</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">👤</span>
          <input
            type="text"
            [(ngModel)]="form.name"
            name="name"
            required
            placeholder="Jean Dupont"
            class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 transition"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">✉️</span>
          <input
            type="email"
            [(ngModel)]="form.email"
            name="email"
            required
            placeholder="jean.dupont@exemple.com"
            class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 transition"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Téléphone</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">📞</span>
          <input
            type="tel"
            [(ngModel)]="form.telephone"
            name="telephone"
            placeholder="06 12 34 56 78"
            class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 transition"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Mot de passe</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">🔒</span>
          <input
            type="password"
            [(ngModel)]="form.password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 transition"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Confirmer le mot de passe</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">🔄</span>
          <input
            type="password"
            [(ngModel)]="form.password_confirmation"
            name="password_confirmation"
            required
            placeholder="••••••••"
            class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 transition"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-xl transition duration-200 shadow-sm flex items-center justify-center space-x-2 disabled:opacity-50">
        @if (loading) {
          <span>Inscription...</span>
        } @else {
          <span>S'inscrire</span>
          <span>➔</span>
        }
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-600">
        Déjà un compte ?
        <a routerLink="/login" class="font-bold text-blue-600 hover:underline ml-1">Se connecter</a>
      </p>
    </div>
  </div>
</div>
